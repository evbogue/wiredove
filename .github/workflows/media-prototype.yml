name: Wiredove acceptance

on:
  push:
    branches: [master, feature/media-prototype]
  pull_request:

permissions:
  contents: read

jobs:
  node-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run check:node
      - run: npm run test:server
      - run: npm run test:media

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.13
      - run: npm ci
      - name: Check server and monitor module graph
        run: npm run check && npm run check:deno
      - name: Authentication, notification, shared UI and routing regressions
        run: npm test
      - name: Signed media, verification and persistence regressions
        run: npm run test:media
      - name: Node and Deno shared-storage parity
        run: TEST_DENO_PARITY=1 npm run test:server
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Website and separate-origin embed browser acceptance
        run: npm run test:browser
      - name: Real Node website and embed acceptance
        run: WIREDOVE_TEST_RUNTIME=node node tests/application-flow.browser.cjs
      - name: Retain browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiredove-browser-screenshots
          path: |
            /tmp/gallery-*.png
            /tmp/message-shell-*.png
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wiredove:test .
      - name: Non-root container persistence and health
        run: |
          docker volume create wiredove-test-data
          docker run -d --name wiredove-test -p 8000:8000 -v wiredove-test-data:/app/data wiredove:test
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://localhost:8000/vapid-public-key > /tmp/vapid-before
          test "$(docker exec wiredove-test id -u)" != 0
          docker exec wiredove-test test -s /app/data/config.json
          docker restart wiredove-test
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/vapid-public-key > /tmp/vapid-after; then break; fi
            sleep 1
          done
          cmp /tmp/vapid-before /tmp/vapid-after
          for attempt in $(seq 1 45); do
            test "$(docker inspect --format '{{.State.Health.Status}}' wiredove-test)" = healthy && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' wiredove-test)" = healthy
      - if: always()
        run: docker logs wiredove-test; docker rm -f wiredove-test; docker volume rm wiredove-test-data
